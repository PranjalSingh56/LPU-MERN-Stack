<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <!-- (CDN) REACT LIBRARY TO CREATE UI (creation)-->
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- TO SHOW INSINDE THE BROWSER (rendering) -->
    <title>Without JSX</title>
</head>

<body>
    <div id="root"></div>

    <script>
        const element = React.createElement('h1', null, 'Hello STUDENTS (NO JSX)');
        // create UI
        const root = document.getElementById('root');
        const reactRoot = ReactDOM.createRoot(root);
        // it will find the root element and render the element inside it (div)
        reactRoot.render(element);  
    </script>
</body>

</html>

<!-- without JSX IT  IS JUST A ASSEMBLY LANGIAGE, 
 WITH JSX IT IS IMPLE ENGLISH -->
