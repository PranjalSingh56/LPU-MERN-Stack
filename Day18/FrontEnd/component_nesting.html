<!DOCTYPE html>
<html>

<head>
    <title>Practice map</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>

<body>
    <div id="root"></div>
    <script type="text/babel">
        function Headers() {
            return (
                <>
                    <h1 style = {{backgroundColor:"skyblue", color:"white"}}>My App Header</h1>
                    </>
            );
        }
        function Card() {
            return (
                
                    <h2 style = {{backgroundColor:"blue",color:"white"}}>this is card components</h2>
            );
        }
        function Footer() {
            return (
                
                    <footer style = {{backgroundColor:"red",color:"white"}}>this is Footer</footer>
            );
        }

        function App() {
    
            return (
                <div >
                   <Headers  />
                   <Card />
                   <Footer/>
                  
                </div>
            );
        }
        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);
    </script>
    
</body>

</html>
